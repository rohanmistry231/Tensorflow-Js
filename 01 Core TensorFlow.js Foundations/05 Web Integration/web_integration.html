<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TensorFlow.js: Web Integration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        video, canvas { border: 1px solid #ccc; }
        pre { background: #f4f4f4; padding: 10px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
</head>
<body>
    <h1>TensorFlow.js: Web Integration</h1>
    <video id="webcam" width="224" height="224" autoplay></video>
    <canvas id="canvas" width="224" height="224"></canvas>
    <div id="output"></div>
    <pre id="interview"></pre>

    <script>
        // %% [1. Introduction to Web Integration]
        // Learn how to integrate TensorFlow.js with web applications.
        async function runWebIntegrationDemo() {
            const output = document.getElementById('output');
            output.innerHTML = `TensorFlow.js version: ${tf.version.tfjs}<br>`;

            // %% [2. Real-Time Webcam Inference]
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                });
            const model = tf.sequential([
                tf.layers.flatten({ inputShape: [224, 224, 3] }),
                tf.layers.dense({ units: 10, activation: 'softmax' })
            ]);
            model.compile({ optimizer: 'adam', loss: 'categoricalCrossentropy' });
            // Simulate prediction (random for demo).
            setInterval(async () => {
                const tensor = tf.browser.fromPixels(video).resizeNearestNeighbor([224, 224]);
                const prediction = model.predict(tensor.div(255.0).expandDims());
                const predValue = (await prediction.array())[0];
                ctx.drawImage(video, 0, 0, 224, 224);
                output.innerHTML = `Webcam Prediction: ${predValue.indexOf(Math.max(...predValue))}<br>`;
                tensor.dispose();
                prediction.dispose();
            }, 1000);
            output.innerHTML += `Webcam Inference Running<br>`;

            // %% [3. Debugging Browser Performance]
            output.innerHTML += `Memory Usage: ${tf.memory().numTensors} tensors<br>`;

            // %% [4. Interview Scenario: Web Integration]
            const interview = document.getElementById('interview');
            interview.innerText = `
Interview Scenario: Web Integration
Q: How do you integrate TensorFlow.js with a webcam?
A: Use tf.browser.fromPixels and model.predict for real-time inference.
Key: Web integration leverages browser APIs like MediaDevices.
Example: tensor = tf.browser.fromPixels(video); model.predict(tensor);
            `;
        }
        runWebIntegrationDemo();
    </script>
</body>
</html>
