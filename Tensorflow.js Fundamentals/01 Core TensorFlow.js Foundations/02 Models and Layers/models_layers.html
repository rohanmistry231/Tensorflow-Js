<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TensorFlow.js: Models and Layers</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f4f4f4; padding: 10px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
</head>
<body>
    <h1>TensorFlow.js: Models and Layers</h1>
    <div id="output"></div>
    <pre id="interview"></pre>

    <script>
        // %% [1. Introduction to Models and Layers]
        // Learn how to define and use models/layers in TensorFlow.js.
        async function runModelsDemo() {
            const output = document.getElementById('output');
            output.innerHTML = `TensorFlow.js version: ${tf.version.tfjs}<br>`;

            // %% [2. Defining Models]
            const model = tf.sequential();
            model.add(tf.layers.dense({ units: 16, activation: 'relu', inputShape: [4] }));
            model.add(tf.layers.dense({ units: 8, activation: 'relu' }));
            model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
            model.compile({
                optimizer: 'adam',
                loss: 'binaryCrossentropy',
                metrics: ['accuracy']
            });
            output.innerHTML += `Sequential Model Created<br>`;

            // %% [3. Functional Model]
            const inputs = tf.input({ shape: [4] });
            const dense1 = tf.layers.dense({ units: 16, activation: 'relu' }).apply(inputs);
            const dense2 = tf.layers.dense({ units: 8, activation: 'relu' }).apply(dense1);
            const outputs = tf.layers.dense({ units: 1, activation: 'sigmoid' }).apply(dense2);
            const funcModel = tf.model({ inputs, outputs });
            funcModel.compile({
                optimizer: 'adam',
                loss: 'binaryCrossentropy',
                metrics: ['accuracy']
            });
            output.innerHTML += `Functional Model Created<br>`;

            // %% [4. Training a Model]
            const X = tf.randomNormal([100, 4]);
            const y = X.sum(1).greater(tf.scalar(0)).toFloat();
            const history = await model.fit(X, y, {
                epochs: 5,
                batchSize: 32,
                validationSplit: 0.2,
                verbose: 0
            });
            output.innerHTML += `Model Trained. Final Loss: ${history.history.loss.slice(-1)[0].toFixed(4)}<br>`;

            // %% [5. Practical ML Application]
            // Predict and display results.
            const X_test = tf.randomNormal([5, 4]);
            const predictions = model.predict(X_test);
            const predValues = await predictions.array();
            output.innerHTML += `Predictions for 5 samples:\n${predValues.map(v => v[0].toFixed(4)).join(', ')}<br>`;

            // %% [6. Interview Scenario: Models and Layers]
            const interview = document.getElementById('interview');
            interview.innerText = `
Interview Scenario: Models and Layers
Q: How do you define a neural network in TensorFlow.js?
A: Use tf.sequential for simple models or tf.model for complex ones.
Key: Layers like dense and conv2d define the architecture.
Example: model = tf.sequential(); model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
            `;
        }
        runModelsDemo();
    </script>
</body>
</html>
