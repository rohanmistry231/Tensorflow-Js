<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TensorFlow.js: Training in the Browser</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f4f4f4; padding: 10px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis@latest"></script>
</head>
<body>
    <h1>TensorFlow.js: Training in the Browser</h1>
    <div id="output"></div>
    <div id="vis" style="width: 400px; height: 300px;"></div>
    <pre id="interview"></pre>

    <script>
        // %% [1. Introduction to Training in the Browser]
        // Learn how to train models in the browser with TensorFlow.js.
        async function runTrainingDemo() {
            const output = document.getElementById('output');
            output.innerHTML = `TensorFlow.js version: ${tf.version.tfjs}<br>`;

            // %% [2. Training Models]
            const model = tf.sequential([
                tf.layers.dense({ units: 16, activation: 'relu', inputShape: [4] }),
                tf.layers.dense({ units: 1, activation: 'sigmoid' })
            ]);
            model.compile({
                optimizer: 'adam',
                loss: 'binaryCrossentropy',
                metrics: ['accuracy']
            });
            const X = tf.randomNormal([100, 4]);
            const y = X.sum(1).greater(tf.scalar(0)).toFloat();
            const history = await model.fit(X, y, {
                epochs: 10,
                batchSize: 32,
                validationSplit: 0.2,
                callbacks: tfvis.show.fitCallbacks(
                    { name: 'Training' },
                    ['loss', 'val_loss', 'acc', 'val_acc'],
                    { height: 200 }
                ),
                verbose: 0
            });
            output.innerHTML += `Model Trained. Final Accuracy: ${history.history.acc.slice(-1)[0].toFixed(4)}<br>`;

            // %% [3. Callbacks]
            const customCallback = {
                onEpochEnd: async (epoch, logs) => {
                    output.innerHTML += `Epoch ${epoch + 1}: Loss = ${logs.loss.toFixed(4)}<br>`;
                }
            };
            await model.fit(X, y, {
                epochs: 2,
                batchSize: 32,
                callbacks: [customCallback],
                verbose: 0
            });
            output.innerHTML += `Training with Custom Callback Completed<br>`;

            // %% [4. Saving/Loading Models]
            await model.save('localstorage://my-model');
            const loadedModel = await tf.loadLayersModel('localstorage://my-model');
            output.innerHTML += `Model Saved and Loaded from Local Storage<br>`;

            // %% [5. Practical ML Application]
            // Visualize training history with tfjs-vis.
            const visContainer = document.getElementById('vis');
            await tfvis.show.history(visContainer, history, ['loss', 'val_loss'], { height: 300 });
            output.innerHTML += `Training History Visualized with tfjs-vis<br>`;

            // %% [6. Interview Scenario: Training]
            const interview = document.getElementById('interview');
            interview.innerText = `
Interview Scenario: Training in the Browser
Q: How do you train a model in TensorFlow.js?
A: Use model.fit with tensors or tf.data.Dataset, add callbacks.
Key: Browser training requires memory management and async operations.
Example: model.fit(X, y, { epochs: 10, callbacks: [...] });
            `;
        }
        runTrainingDemo();
    </script>
</body>
</html>
