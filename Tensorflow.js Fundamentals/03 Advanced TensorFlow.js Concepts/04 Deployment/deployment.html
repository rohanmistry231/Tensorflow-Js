<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TensorFlow.js: Deployment</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f4f4f4; padding: 10px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
</head>
<body>
    <h1>TensorFlow.js: Deployment</h1>
    <div id="output"></div>
    <pre id="interview"></pre>

    <script>
        // %% [1. Introduction to Deployment]
        // Learn how to deploy TensorFlow.js models for web ML.
        async function runDeploymentDemo() {
            const output = document.getElementById('output');
            output.innerHTML = `TensorFlow.js version: ${tf.version.tfjs}<br>`;

            // %% [2. Model Conversion and Hosting]
            const model = tf.sequential([
                tf.layers.dense({ units: 16, activation: 'relu', inputShape: [4] }),
                tf.layers.dense({ units: 1, activation: 'sigmoid' })
            ]);
            model.compile({ optimizer: 'adam', loss: 'binaryCrossentropy' });
            await model.save('localstorage://deployed-model');
            const loadedModel = await tf.loadLayersModel('localstorage://deployed-model');
            const prediction = loadedModel.predict(tf.randomNormal([1, 4]));
            output.innerHTML += `Model Saved and Loaded: Prediction = ${(await prediction.array())[0][0].toFixed(4)}<br>`;

            // %% [3. Server-Side Inference with Node.js (Commented for Reference)]
            /*
            // Requires Node.js and @tensorflow/tfjs-node
            const tf = require('@tensorflow/tfjs-node');
            const model = await tf.loadLayersModel('file://./model/model.json');
            const input = tf.randomNormal([1, 4]);
            const prediction = model.predict(input);
            console.log('Node.js Prediction:', prediction.arraySync());
            */

            // %% [4. Progressive Web App (PWA) Setup]
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(() => output.innerHTML += `Service Worker Registered for PWA<br>`)
                    .catch(err => output.innerHTML += `Service Worker Error: ${err}<br>`);
            }

            // %% [5. Practical ML Application]
            // Simulate lazy loading.
            async function lazyLoadModel() {
                const model = await tf.loadLayersModel('localstorage://deployed-model');
                output.innerHTML += `Model Lazy Loaded<br>`;
                return model;
            }
            const lazyModel = await lazyLoadModel();
            output.innerHTML += `Lazy Loaded Model Ready<br>`;

            // %% [6. Interview Scenario: Deployment]
            const interview = document.getElementById('interview');
            interview.innerText = `
Interview Scenario: Deployment
Q: How do you deploy a TensorFlow.js model as a PWA?
A: Save the model, host it via CDN, and use Service Workers for offline access.
Key: PWAs enable edge deployment with fast load times.
Example: navigator.serviceWorker.register('/service-worker.js');
            `;
        }
        runDeploymentDemo();
    </script>
</body>
